# Used by MegaLinter's MARKDOWN_MARKDOWNLINT.
default: true

# Line length. The records here wrap prose near 80 columns by hand, but tables,
# code fences carrying program output, and long links do not fit and should not
# be broken up to satisfy a counter.
MD013: false

# Inline HTML. The README and the ADRs use a little of it for layout.
MD033: false

# First line must be a top-level heading. Several records open with a status
# block instead, deliberately.
MD041: false

# Table pipe spacing. A style rule added in markdownlint 0.49 that reads the
# first table in a file and then requires every other table to match it. These
# tables are written by hand, read fine either way, and normalising 57 pipes
# across eight records buys nothing - it is the one rule here turned off for
# taste rather than for a reason about this repository.
MD060: false
