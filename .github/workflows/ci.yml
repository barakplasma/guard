name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run MegaLinter
        id: megalinter
        uses: oxsecurity/megalinter/flavors/javascript@v10
        env:
          APPLY_FIXES: all
          DISABLE_LINTERS: ACTION_ZIZMOR
          ENABLE: ACTION,JAVASCRIPT,JSON,JSX,TSX,TYPESCRIPT,YAML
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_COMMENT_REPORTER: false
          VALIDATE_ALL_CODEBASE: false
      - name: Commit MegaLinter fixes
        if: >-
          steps.megalinter.outputs.has_updated_sources == 1 &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.head_ref }}
          commit_message: "[MegaLinter] Apply automatic fixes"

  check:
    runs-on: ubuntu-latest
    # An explicit timeout on every job: the default is 360 minutes, so one hung
    # step would hold the concurrency group - and every later run - for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Scheduler unit tests plus the fast-check invariants. These are the only
      # guard against a fairness or double-booking regression, so they gate the
      # build rather than running after it.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The browser suites, on every pull request rather than only after merge.
  # They are the only cover for whole classes of bug the unit tests cannot see
  # - MUI dropping a test id, a zod schema rejecting a freshly added mission, a
  # date field whose hour arithmetic depends on the device's clock format. That
  # last one shipped red: release.yml ran these after the merge, which is too
  # late to keep main green.
  e2e-browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Serve built app
        run: npx vite preview --port 4173 --strictPort &

      - name: Wait for server
        run: npx --yes wait-on@8 -t 30000 http://localhost:4173

      # Every suite README.md tells a contributor to run, in that order. Kept in
      # step with release.yml's list, which was missing two of them.
      - name: Run browser e2e tests
        run: |
          node tests/e2e.mjs
          node tests/features.e2e.mjs
          node tests/number-inputs.e2e.mjs
          node tests/mui-controls.e2e.mjs
          node tests/mui-pickers.e2e.mjs
          node tests/short-shifts.e2e.mjs
          node tests/assignment-badges.e2e.mjs
          node tests/carried-duty.e2e.mjs
          node tests/mobile-viewports.mjs
        env:
          BASE: http://localhost:4173
          SHOT_DIR: /tmp/guard-shots

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/guard-shots/
          if-no-files-found: ignore
