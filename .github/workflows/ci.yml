name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Scheduler unit tests plus the fast-check invariants. These are the only
      # guard against a fairness or double-booking regression, so they gate the
      # build rather than running after it.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
