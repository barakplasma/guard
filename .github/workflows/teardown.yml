name: Teardown retired deployment

# Removes the old PocketBase guard deployment from the k3s cluster once the
# static-planner reset (PR #10) merges into main. With the chart source gone,
# ArgoCD can no longer render manifests, so it would error instead of pruning.
# This workflow deletes the namespace + the ArgoCD Application/ImageUpdater
# explicitly, leaving k3s clean.
#
# Requires a repository secret KUBECONFIG (base64 of a kubeconfig that can talk
# to the home k3s cluster). Without it the job fails loudly with guidance;
# create it under Settings -> Secrets and variables -> Actions.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: teardown-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  teardown:
    # Only on a real merge into main. workflow_dispatch skips this gate.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Only run once the deployment source is actually removed
        id: gone
        run: |
          if [ -f charts/guard/Chart.yaml ]; then
            echo "charts/guard/Chart.yaml still present on main - nothing to tear down."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "charts/guard gone - tearing down the retired deployment."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check KUBECONFIG secret exists
        if: steps.gone.outputs.skip == 'false'
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG" ]; then
            echo "::error::The KUBECONFIG repository secret is not set."
            echo "::error::Add it under Settings -> Secrets and variables -> Actions,"
            echo "::error::then re-run this workflow (Actions tab -> 'Run workflow')."
            echo "::error::Until then the guard namespace stays in the cluster."
            exit 1
          fi

      - name: Configure kubectl
        if: steps.gone.outputs.skip == 'false'
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client
          kubectl config current-context

      - name: Tear down guard
        if: steps.gone.outputs.skip == 'false'
        run: scripts/teardown-guard.sh --yes
