name: Release

# Builds the static app once and publishes to three channels in parallel:
#   1. GitHub Pages         — https://barakplasma.github.io/guard/
#   2. GitHub Release zip   — download, unzip, serve with anything
#   3. OCI image (Caddy)    — docker run, done
#
# Every channel gets the same build. Browser e2e tests gate deployment:
# if the app is broken, nothing ships.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create releases
  packages: write   # push to GHCR
  pages: write      # deploy to Pages
  id-token: write   # Pages deploy attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and test
        run: npm run lint && npm test

      - name: Build statics (root-relative for zip + OCI)
        run: npm run build

      - name: Zip the statics
        run: cd dist && zip -r ../guard-static.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: static-zip
          path: guard-static.zip

  e2e-browser:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright
        run: npm i --no-save playwright && npx playwright install --with-deps chromium

      - name: Serve built app
        run: npx vite preview --port 4173 --strictPort &

      - name: Wait for server
        run: npx --yes wait-on@8 -t 30000 http://localhost:4173

      - name: Run browser e2e tests
        run: node tests/e2e.mjs
        env:
          BASE: http://localhost:4173

  pages:
    needs: e2e-browser
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build statics (Pages sub-path)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  release-zip:
    needs: e2e-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: static-zip

      - name: Create or update rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          SHA_SHORT=$(echo "$SHA" | cut -c1-7)
          NOTES="Auto-built from main ($SHA_SHORT). Download the zip, unzip, serve with any static file server."
          if ! gh release view latest 2>/dev/null; then
            gh release create latest guard-static.zip \
              --title "Latest" \
              --notes "$NOTES" \
              --target main
          else
            gh release upload latest guard-static.zip --clobber
            gh release edit latest --notes "$NOTES" --target main
          fi

  oci:
    needs: e2e-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          SHA_TAG="${IMAGE}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          docker build -t "${IMAGE}:latest" -t "${SHA_TAG}" .
          docker push "${IMAGE}:latest"
          docker push "${SHA_TAG}"

  e2e-oci:
    needs: oci
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the image and verify it serves
        run: |
          set -eu
          docker run -d --name guard-test -p 8080:80 ghcr.io/${{ github.repository }}:latest
          sleep 2

          # 1. Main page returns HTML with a title
          HTML=$(curl -fs http://localhost:8080)
          echo "$HTML" | grep -q '<title>' || { echo "FAIL: no <title> in response"; exit 1; }
          echo "PASS: index.html served"

          # 2. Service worker is present
          SW_CODE=$(curl -fs -o /dev/null -w '%{http_code}' http://localhost:8080/sw.js)
          [ "$SW_CODE" = "200" ] || { echo "FAIL: /sw.js returned $SW_CODE"; exit 1; }
          echo "PASS: /sw.js exists"

          # 3. SPA fallback works (unknown path returns index.html)
          FALLBACK=$(curl -fs -o /dev/null -w '%{http_code}' http://localhost:8080/some/deep/route)
          [ "$FALLBACK" = "200" ] || { echo "FAIL: SPA fallback returned $FALLBACK"; exit 1; }
          echo "PASS: SPA fallback works"

          # 4. Static assets exist
          ASSET=$(curl -fs http://localhost:8080 | grep -o '/assets/[^"]*\.js' | head -1)
          if [ -n "$ASSET" ]; then
            ACODE=$(curl -fs -o /dev/null -w '%{http_code}' "http://localhost:8080${ASSET}")
            [ "$ACODE" = "200" ] || { echo "FAIL: asset $ASSET returned $ACODE"; exit 1; }
            echo "PASS: assets served"
          else
            echo "FAIL: no JS assets found in HTML"; exit 1
          fi

          docker stop guard-test || true
          echo "All OCI e2e checks passed."

  e2e-pages:
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - name: Verify the Pages site is live
        run: |
          set -eu
          URL="${{ needs.pages.outputs.page_url }}"
          # Pages propagation can lag a few seconds after deploy
          for i in $(seq 1 10); do
            CODE=$(curl -fs -o /dev/null -w '%{http_code}' "$URL" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then break; fi
            sleep 5
          done
          [ "$CODE" = "200" ] || { echo "FAIL: $URL returned $CODE"; exit 1; }
          HTML=$(curl -fs "$URL")
          echo "$HTML" | grep -q '<title>' || { echo "FAIL: no <title> at $URL"; exit 1; }
          echo "PASS: Pages site is live at $URL"
