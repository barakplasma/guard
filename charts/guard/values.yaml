# Image published from this repository's Dockerfile.
image:
  repository: ghcr.io/barakplasma/guard-app
  tag: latest
  pullPolicy: Always

# Add the GHCR pull secret if the image is private.
imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # Matches the existing tunnel ingress name, so Helm can adopt it in place.
  name: cloudflare-tunnel
  className: cloudflare-tunnel
  host: guard.526462738.xyz
  annotations: {}

persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 500Mi
  # Set this to use a PVC created outside this chart.
  existingClaim: ""

# The referenced Secret must contain SUPERUSER_EMAIL and SUPERUSER_PASSWORD.
superuser:
  existingSecret: guard-superuser

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10

nameOverride: ""
fullnameOverride: ""
