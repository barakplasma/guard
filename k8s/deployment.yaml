apiVersion: apps/v1
kind: Deployment
metadata:
  name: guard
  namespace: guard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: guard
  template:
    metadata:
      labels:
        app: guard
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: guard
          image: ghcr.io/barakplasma/guard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          envFrom:
            - secretRef:
                name: guard-superuser
          volumeMounts:
            - name: pb-data
              mountPath: /app/pb_data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: pb-data
          persistentVolumeClaim:
            claimName: guard-pb-data
