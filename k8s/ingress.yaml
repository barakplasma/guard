# No Cloudflare Access policy on this ingress - explicit user override of the
# standing CLAUDE.md rule requiring one on every new ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-tunnel
  namespace: guard
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: guard.526462738.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guard
                port:
                  number: 80
