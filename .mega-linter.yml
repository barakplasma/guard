# MegaLinter, JavaScript flavor - https://megalinter.io/latest/flavors/javascript/
#
# Runs on pull requests only (.github/workflows/ci.yml). It is an allow-list
# rather than the flavor's full set, and the omissions are deliberate enough to
# be worth naming - a future reader turning one of them on will reformat the
# whole repository or paint the build red for things it cannot fix.
#
# **The JavaScript linters are off on purpose.** This repository lints with
# `oxlint` (`npm run lint`, `.oxlintrc.json`), which already gates every pull
# request in the `check` job. Adding eslint, standard, prettier or biome beside
# it means two tools with different opinions about the same files, and the
# louder one wins by reformatting. MegaLinter earns its place here on everything
# `oxlint` does *not* cover: workflows, YAML, shell, the Dockerfile, secrets.
#
# Also off, with reasons:
#   - SPELL_*      : the app is Hebrew-only and the records are full of domain
#                    terms and Hebrew mission names. A spell checker here is a
#                    dictionary-maintenance job, not a quality gate.
#   - COPYPASTE_JSCPD : the measurement scripts in `scripts/` and
#                    `prototype/minizinc/` deliberately share one generator, seed
#                    included, so their numbers are comparable. That duplication
#                    is the point and jscpd would flag exactly it.
#   - REPOSITORY_GRYPE / TRIVY / OSV_SCANNER : transitive CVEs in dev
#                    dependencies would red the build over things this repo
#                    cannot fix, and `npm audit` already reports them.
#   - Everything Kubernetes, Ansible, Terraform, Java, Python: no such files.

APPLY_FIXES: none
FLAVOR_SUGGESTIONS: false
PRINT_ALPHA: false
SHOW_ELAPSED_TIME: true

# Check the whole repository, not only the diff. It is small, the linters below
# are fast, and a rule that only ever sees changed files never notices the file
# that was already wrong.
VALIDATE_ALL_CODEBASE: true

ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_SHELLCHECK
  - DOCKERFILE_HADOLINT
  - JSON_JSONLINT
  - MARKDOWN_MARKDOWNLINT
  - REPOSITORY_SECRETLINT
  - YAML_YAMLLINT

# Build output, dependencies, and screenshots the browser suites write.
FILTER_REGEX_EXCLUDE: (^|/)(dist|node_modules|screenshots)/

# `.oxlintrc.json` is JSONC - oxlint reads the comments in it, and they explain
# why three rules are off. A strict JSON parser cannot, so it is excluded rather
# than the comments deleted.
JSON_FILTER_REGEX_EXCLUDE: (^|/)\.oxlintrc\.json$
